[package]
name = "miso-midi-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for the Miso MIDI Rust core"
publish = false

[lib]
name = "miso_midi_native"
crate-type = ["cdylib"]

[dependencies]
miso-midi-core = { path = "../../crates/miso-midi-core" }
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }

[lints]
workspace = true
